# Publishes the site to GitHub Pages on every push and once a day.
# The daily run refreshes the mirrored station lists (lists/*.m3u) inside the published site only,
# so generated files never land in git history.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mirror station lists
        run: node scripts/mirror-lists.mjs
        continue-on-error: true   # a list server being down shouldn't stop the site from deploying
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
