name: Mirror station lists

on:
  schedule:
    - cron: '17 4 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/mirror-lists.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists
          git diff --cached --quiet || git commit -m "Update mirrored station lists"
          git push
